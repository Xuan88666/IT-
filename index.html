<!doctype html>
<html lang="zh-CN" data-app-version="0.1.0">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT 运维百宝箱</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 字体异步加载：离线/弱网环境不阻塞首屏渲染，加载失败自动回退系统字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <!-- lucide 图标本地化：离线环境可用，不再依赖 unpkg CDN；保持同步加载确保首次渲染时 window.lucide 已就绪 -->
    <script src="/vendor/lucide.min.js"></script>
    <link rel="stylesheet" href="/toolkit.css" />
    <link rel="stylesheet" href="/bento.css" />
    <link rel="stylesheet" href="/version-update.css" />
  </head>
  <body>
    <div id="bento-app" class="tk-app"><div id="tk-app"></div></div>
    <script>
      if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
        window.__OPSHUB_API_BASE_URL = `${location.protocol}//${location.host}/api`;
      }
    </script>
    <script src="/app.js?v=toolkit-v7-worklog"></script>
    <script src="/version-update.js"></script>
  </body>
</html>
