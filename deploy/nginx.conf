# ============================================================
# IT 运维百宝箱 - Nginx 反向代理配置
# 适用于生产环境部署（Docker 或 裸机）
# ============================================================
upstream opsbox_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name opsbox.example.com;

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy same-origin;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # 静态资源缓存（前端资源已带 ETag，这里做短期 CDN 缓存）
    location ~* \.(css|js|mjs|svg|png|jpg|ico)$ {
        proxy_pass http://opsbox_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1d;
        add_header Cache-Control "public, no-cache";
    }

    # API 请求（不缓存）
    location /api/ {
        proxy_pass http://opsbox_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    # AI 流式响应
    location /api/ai/ {
        proxy_pass http://opsbox_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # WebSocket 支持（远程 SSH/Telnet 终端）
    location /api/remote/ {
        proxy_pass http://opsbox_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 前端 SPA（所有非 API 路由）
    location / {
        proxy_pass http://opsbox_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
